# One workflow, three OSes. Every gate here exists because the alternative is a
# promise in a markdown file that nothing checks.
#
# CI has NO oracle: the upstream ISDA sources are licence-gated and never
# committed, so the live differential suite (tier 2) cannot run here. CI runs
# tier 1 -- the port replaying reference vectors recorded locally into
# tests/golden/. Run `ctest --preset debug` with a local upstream copy before
# pushing; that is where tier 2 lives.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # UTF-8 forced: the tree is cross-OS and encoding is not a per-platform
      # guess. Without this, Windows Python reads the reports as cp1252 and
      # chokes on an em-dash.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: lukka/get-cmake@latest
      # Ninja presets need the MSVC environment on Windows; without this the
      # configure step picks up no C++ compiler at all.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # Runs FIRST and on every OS. Committing the upstream sources would route
      # around ISDA's own distribution gate -- a licence breach, not a bug -- so
      # it is checked before a single object file is built.
      - run: python verify.py upstream-absent

      # A port whose ancestry is undocumented cannot be reviewed against its
      # original. Each header must name the 2009 file it answers to.
      - run: python verify.py provenance

      # The opposite failure, and it cost a slice to learn the difference:
      # cxbsearch.c's JpmcdsBinarySearchLong was ported TWICE, months apart,
      # and every gate was satisfied -- port_progress counts a function as done
      # when ANY header claims it, so 100% was reported either way.
      - run: python verify.py claims
      - run: python verify.py error-channel
      - run: python verify.py umbrella
      # D23: python/ and xl/core/ are peers; neither may depend on the other.
      - run: python verify.py python-layer

      # A hand-edited golden file is how a port's bug becomes the port's
      # specification. Vectors must be generated, and have a generator.
      - run: python verify.py golden

      # The defect register, the full report and the published page describe the
      # same findings. Prose cannot be diffed, but a missing id can be caught,
      # and adding a defect to one surface and forgetting the others is the
      # realistic failure.
      - run: python verify.py reports

      - run: cmake --preset release
      - run: cmake --build --preset release

      # The suite, with a floor on tests actually RUN. Carried from pricebook's
      # scar: a green run over a truncated collection is not evidence. A broken
      # gtest_discover_tests, or a test file dropped from CMakeLists, reports
      # "all passed" over almost nothing.
      - run: python verify.py tests --preset release

      # Artifact #2. The install tree and a real consumer -- "reading the
      # CMake and nodding is not an oracle". install-tree also enforces
      # CLAUDE.md rule 2 mechanically now that install rules exist.
      # Coverage, on macOS only: it needs llvm-cov (xcrun provides it there)
      # and the figure is platform-independent for this code, so measuring it
      # three times would cost minutes and tell us the same thing. Floors live
      # in verify.py -- raise them when coverage rises, never lower them.
      # The Windows-only XL layers, typechecked against the real xlcall.h.
      # Skipped unless the SDK is present, which it is not on a CI runner --
      # so this is a no-op here and a real check on a developer machine. Left
      # in so the command is discoverable from the workflow.
      - if: runner.os == 'macOS'
        run: test -f xlsdk/xlcall.h && ./tools/typecheck_xl.sh || echo "no SDK on this runner; skipped"

      - if: runner.os == 'macOS'
        run: python verify.py coverage

      - run: python verify.py install-tree
      - run: python tools/check_consumer.py

  # Separate job, Linux only: the asan/ubsan presets are Clang/GCC-only, and a
  # sanitizer build is slow enough that it should not block the matrix.
  # This pair already found a genuine out-of-bounds read in the original model
  # (UPSTREAM-1 in docs/port-notes.md) on its first run.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: lukka/get-cmake@latest
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  # Advisory until the tree is fully normalised against the pinned version.
  # Pinned to the same clang-format as requirements-dev.txt: unpinned runners
  # format trailing comments differently and flag spurious diffs against
  # locally-formatted code.
  format:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Port sources only. Upstream C is never reformatted, and is not here anyway.
      - run: |
          clang-format --dry-run -Werror \
            $(git ls-files 'include/**/*.hpp' 'src/*.cpp' 'tests/*.cpp' 'tools/*.cpp' \
              'python/src/*.cpp' 'python/src/*.hpp' \
              | grep -v '^tests/golden/')

  # The Python package. Separate from `verify` because it needs no oracle and
  # no C++ test build -- it builds the wheel the way a user's `pip install`
  # would, installs it, and runs the suite against the INSTALLED package
  # rather than the source tree. A test that passes only from the repo root
  # would not catch a packaging mistake, which is most of what can go wrong
  # here (P1 shipped `include/` and `lib/libcdsmodel.a` into the wheel before
  # this job existed).
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # D1: cp312-abi3. One wheel per platform covers 3.12 and later, so
          # the build needs exactly one interpreter.
          python-version: "3.12"
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build --wheel -o dist .

      # P1: the tag is asserted, not eyeballed. A wheel that quietly built as
      # cp312-cp312 instead of cp312-abi3 would install and import fine here
      # and then fail for every user on 3.13.
      - name: Assert the wheel is cp312-abi3
        shell: python
        run: |
          from pathlib import Path
          names = [p.name for p in Path("dist").glob("*.whl")]
          assert len(names) == 1, names
          assert "cp312-abi3" in names[0], f"not an abi3 wheel: {names[0]}"
          print("ok:", names[0])

      # Installed, not in-tree: `pip install` from a clean environment is the
      # thing a user actually does.
      - name: Install and run the suite
        run: |
          python -m pip install --find-links dist cdsmodel
          python -m pytest tests/python -q
