# One workflow, three OSes. Every gate here exists because the alternative is a
# promise in a markdown file that nothing checks.
#
# CI has NO oracle: the upstream ISDA sources are licence-gated and never
# committed, so the live differential suite (tier 2) cannot run here. CI runs
# tier 1 -- the port replaying reference vectors recorded locally into
# tests/golden/. Run `ctest --preset debug` with a local upstream copy before
# pushing; that is where tier 2 lives.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # UTF-8 forced: the tree is cross-OS and encoding is not a per-platform
      # guess. Without this, Windows Python reads the reports as cp1252 and
      # chokes on an em-dash.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: lukka/get-cmake@latest
      # Ninja presets need the MSVC environment on Windows; without this the
      # configure step picks up no C++ compiler at all.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # Runs FIRST and on every OS. Committing the upstream sources would route
      # around ISDA's own distribution gate -- a licence breach, not a bug -- so
      # it is checked before a single object file is built.
      - run: python verify.py upstream-absent

      # A port whose ancestry is undocumented cannot be reviewed against its
      # original. Each header must name the 2009 file it answers to.
      - run: python verify.py provenance

      # The opposite failure, and it cost a slice to learn the difference:
      # cxbsearch.c's JpmcdsBinarySearchLong was ported TWICE, months apart,
      # and every gate was satisfied -- port_progress counts a function as done
      # when ANY header claims it, so 100% was reported either way.
      - run: python verify.py claims
      - run: python verify.py error-channel
      - run: python verify.py umbrella
      # D23: python/ and xl/core/ are peers; neither may depend on the other.
      - run: python verify.py python-layer
      # P10: publishing must stay credential-free.
      - run: python verify.py publishing

      # A hand-edited golden file is how a port's bug becomes the port's
      # specification. Vectors must be generated, and have a generator.
      - run: python verify.py golden

      # The defect register, the full report and the published page describe the
      # same findings. Prose cannot be diffed, but a missing id can be caught,
      # and adding a defect to one surface and forgetting the others is the
      # realistic failure.
      - run: python verify.py reports

      - run: cmake --preset release
      - run: cmake --build --preset release

      # The suite, with a floor on tests actually RUN. Carried from pricebook's
      # scar: a green run over a truncated collection is not evidence. A broken
      # gtest_discover_tests, or a test file dropped from CMakeLists, reports
      # "all passed" over almost nothing.
      - run: python verify.py tests --preset release

      # Artifact #2. The install tree and a real consumer -- "reading the
      # CMake and nodding is not an oracle". install-tree also enforces
      # CLAUDE.md rule 2 mechanically now that install rules exist.
      # Coverage, on macOS only: it needs llvm-cov (xcrun provides it there)
      # and the figure is platform-independent for this code, so measuring it
      # three times would cost minutes and tell us the same thing. Floors live
      # in verify.py -- raise them when coverage rises, never lower them.
      # The Windows-only XL layers, typechecked against the real xlcall.h.
      # Skipped unless the SDK is present, which it is not on a CI runner --
      # so this is a no-op here and a real check on a developer machine. Left
      # in so the command is discoverable from the workflow.
      - if: runner.os == 'macOS'
        run: test -f xlsdk/xlcall.h && ./tools/typecheck_xl.sh || echo "no SDK on this runner; skipped"

      - if: runner.os == 'macOS'
        run: python verify.py coverage

      - run: python verify.py install-tree
      - run: python tools/check_consumer.py

  # Separate job, Linux only: the asan/ubsan presets are Clang/GCC-only, and a
  # sanitizer build is slow enough that it should not block the matrix.
  # This pair already found a genuine out-of-bounds read in the original model
  # (UPSTREAM-1 in docs/port-notes.md) on its first run.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: lukka/get-cmake@latest
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  # Advisory until the tree is fully normalised against the pinned version.
  # Pinned to the same clang-format as requirements-dev.txt: unpinned runners
  # format trailing comments differently and flag spurious diffs against
  # locally-formatted code.
  format:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Port sources only. Upstream C is never reformatted, and is not here anyway.
      - run: |
          clang-format --dry-run -Werror \
            $(git ls-files 'include/**/*.hpp' 'src/*.cpp' 'tests/*.cpp' 'tools/*.cpp' \
              'python/src/*.cpp' 'python/src/*.hpp' \
              | grep -v '^tests/golden/')

  # The Python package. Separate from `verify` because it needs no oracle and
  # no C++ test build -- it builds the wheel the way a user's `pip install`
  # would, installs it, and runs the suite against the INSTALLED package
  # rather than the source tree. A test that passes only from the repo root
  # would not catch a packaging mistake, which is most of what can go wrong
  # here (P1 shipped `include/` and `lib/libcdsmodel.a` into the wheel before
  # this job existed).
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # D1: cp312-abi3. One wheel per platform covers 3.12 and later, so
          # the build needs exactly one interpreter.
          python-version: "3.12"
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build pytest mypy nanobind
          python -m build --wheel -o dist .

      # P1: the tag is asserted, not eyeballed. A wheel that quietly built as
      # cp312-cp312 instead of cp312-abi3 would install and import fine here
      # and then fail for every user on 3.13.
      # A DEV wheel: built natively so the deep checks below run against the
      # same compiler that produces the P3 fixtures. On Linux it is tagged
      # `linux_x86_64`, which PyPI would refuse -- the publishable wheels are
      # built by the `wheels` job with cibuildwheel. Only the ABI and Python
      # tags are asserted here; `tools/check_wheel_tag.py` enforces the
      # platform tag where it matters.
      - name: The dev wheel is cp312-abi3
        shell: python
        run: |
          from pathlib import Path
          names = [p.name for p in Path("dist").glob("*.whl")]
          assert len(names) == 1, names
          _, _, py, abi, _ = names[0].removesuffix(".whl").split("-")[:5]
          assert (py, abi) == ("cp312", "abi3"), f"{names[0]}: got {py}-{abi}"
          print("ok:", names[0])

      # Installed, not in-tree: `pip install` from a clean environment is the
      # thing a user actually does.
      # P3 is an EXACT comparison, and that only holds within a platform:
      # exp/log/pow are not correctly rounded, the library calls them 24
      # times, and glibc and macOS libm differ in the last bit. Measured
      # here: 0.08687005698251757 on Linux against ...758 on macOS.
      #
      # So the fixtures are regenerated on each runner. Without this the
      # suite still passes, but falls back to a 1e-12 tolerance -- which
      # would quietly stop testing the thing P3 exists for.
      - name: Regenerate the value fixtures on this platform (P3)
        run: |
          cmake -S . -B build/fixtures -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCDSMODEL_UPSTREAM_DIR=/nonexistent
          cmake --build build/fixtures --target gen_python_fixtures
          ./build/fixtures/gen_python_fixtures > tests/python/fixtures/pricing.json
        shell: bash

      - name: Install and run the suite
        run: |
          python -m pip install --find-links dist cdsmodel
          python -m pytest tests/python -q

      # P3's fixtures are committed, not regenerated here -- CI has no oracle
      # and needs none for this, but it also must not silently run against an
      # empty or truncated file. The suite asserts the case count itself; this
      # is a cheap second check that the file is present in the sdist-shaped
      # tree at all.
      # P7: the stubs must be real, not decoration. `mypy --strict` over the
      # suite resolves every cdsmodel symbol through the SHIPPED `_core.pyi`
      # and `py.typed` -- remove either and this step fails, which is how it
      # was checked. It also catches API drift: the suite is written against
      # the types, so a changed signature breaks here before it breaks a user.
      - name: Type-check the suite against the shipped stubs (P7)
        run: python -m mypy --strict tests/python

      # The committed stub has to match what the extension actually exposes.
      # Generating it at build time and NOT comparing would let the two drift
      # silently, which is worse than having no stub at all.
      - name: The committed stubs match the built extension
        shell: bash
        run: |
          python -m nanobind.stubgen -m cdsmodel._core -o /tmp/_core.pyi -q
          diff -u python/cdsmodel/_core.pyi /tmp/_core.pyi \
            || { echo "::error::_core.pyi is stale -- regenerate it"; exit 1; }

      # P11: the licence gate. PyPI is a redistribution channel and a far
      # more consequential one than git -- `pip download` hands out whatever
      # is in the sdist. Checks both halves: no ISDA or Microsoft sources,
      # AND our own sources present, because an absence check alone passes
      # on an empty archive.
      - name: The sdist redistributes nothing licensed (P11)
        run: python verify.py sdist

      # P9 and P14: a user with no wheel for their platform builds from the
      # sdist. P14 is the one that matters on a trading desk -- `--no-index`
      # with the build deps pre-staged proves the BUILD needs no network, so
      # a firewall cannot turn `pip install` into a FetchContent timeout.
      - name: Install from the sdist, offline (P9, P14)
        shell: bash
        run: |
          python -m build --sdist -o sdist .
          python -m pip install "scikit-build-core>=0.10" "nanobind>=3.0"
          python -m pip install --no-index --no-build-isolation sdist/*.tar.gz

      - name: The sdist-installed package computes
        shell: python
        run: |
          import datetime as dt
          import cdsmodel
          curve = cdsmodel.ZeroCurve.from_points(
              base_date=dt.date(2024, 1, 2), dates=[dt.date(2029, 1, 2)], rates=[0.03])
          # Not just importable: a number has to come out of it. A wheel that
          # imports and cannot compute would pass a smoke test and fail a user.
          value = curve.discount_factor(dt.date(2027, 1, 2))
          assert 0.0 < value < 1.0, value
          print("sdist install ok:", cdsmodel.__version__, value)

      # Keep what was built. Without this every run discards three wheels
      # and an sdist that are already tested -- and internal distribution
      # then has no source but a developer's laptop. Downloadable from the
      # run's summary page; no index and no PyPI involved.
      - uses: actions/upload-artifact@v4
        with:
          name: cdsmodel-${{ matrix.os }}
          path: |
            dist/*.whl
            sdist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: The value fixtures are present
        shell: python
        run: |
          import json, pathlib
          import sys
          d = json.loads(pathlib.Path("tests/python/fixtures/pricing.json").read_text())
          assert len(d["cases"]) > 100, len(d["cases"])
          here = ("win32" if sys.platform.startswith("win")
                  else "darwin" if sys.platform == "darwin" else "linux")
          # The regeneration step above must actually have run: a fixture
          # from another platform would make every comparison tolerant.
          assert d["platform"] == here, f"fixture is {d['platform']}, runner is {here}"
          print("ok:", len(d["cases"]), "cases, exact comparison on", here)

  # The wheels that would actually be published. Separate from `python`
  # because the two answer different questions.
  #
  # `python` asks whether the CODE is right: it builds natively, so the
  # extension and the P3 fixture generator come from one compiler and one
  # libm, and the 432 value comparisons can be exact.
  #
  # This job asks whether the ARTEFACT is shippable. cibuildwheel builds the
  # Linux wheel inside an old-glibc container so it is tagged `manylinux`
  # rather than `linux_x86_64`, which is the only form PyPI accepts. Its
  # value checks fall back to the 1e-12 tolerance by design -- the committed
  # fixtures were generated elsewhere, and the suite says so rather than
  # pretending the comparison was exact.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the publishable wheel
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      # The check that was missing. A wheel tagged `linux_x86_64` passes an
      # "is it abi3" test and is refused at upload -- after the version
      # number has already been burned by the platforms that succeeded.
      - name: The wheel is publishable (P1)
        shell: bash
        run: python tools/check_wheel_tag.py wheelhouse/*.whl

      - name: Install it and run the suite against it
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links wheelhouse cdsmodel
          python -m pytest tests/python -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 90
