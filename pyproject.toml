[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cdsmodel"
description = "The ISDA CDS Standard Model 1.8.3, ported to C++20."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Bernardo Cohen" }]
keywords = ["cds", "credit", "isda", "derivatives", "quantitative-finance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/bdcbqa314159/cdsmodel"

# D12: the version lives in CMakeLists.txt and is read from there, so the
# C++ library, the extension and the wheel metadata cannot disagree.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''project\(cdsmodel VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'''

[tool.scikit-build]
minimum-version = "0.10"
# Namespaced under build/wheel/, NOT build/{wheel_tag}: CMakePresets already
# owns build/debug and build/release, and a wheel tree sitting beside them
# means a clean of one takes out the other.
build-dir = "build/wheel/{wheel_tag}"
wheel.packages = ["python/cdsmodel"]

# D1: one cp312-abi3 wheel per platform, covering 3.12 and later.
wheel.py-api = "cp312"

# Only the extension goes in the wheel -- see python/CMakeLists.txt.
install.components = ["python"]

# D14: tests off, or the build would FetchContent GoogleTest and `pip install`
# would need network access. CDSMODEL_BUILD_PYTHON gates python/ so a plain
# `cmake --preset debug` never builds the extension.
[tool.scikit-build.cmake.define]
CDSMODEL_BUILD_TESTS = "OFF"
CDSMODEL_BUILD_PYTHON = "ON"
# D23: python/ is a peer of xl/core, not a consumer. See CMakeLists.
CDSMODEL_BUILD_XL = "OFF"

# D9a: the oracle and the Excel SDK are already gitignored, and that alone
# keeps them out. Naming them is defence in depth: the licence rule must not
# rest on one line of .gitignore staying put. P11 unpacks and checks.
[tool.scikit-build.sdist]
exclude = [
  "isda_cds_model_c_v*",
  "xlsdk",
  "tests",
  "tools",
  "docs",
  "specs",
  ".github",
  "xl",
]

# ---------------------------------------------------------------------------
# cibuildwheel: the release wheels.
#
# `python -m build` tags a Linux wheel for the HOST glibc --
# `cp312-abi3-linux_x86_64` -- and PyPI refuses that, because a bare `linux_`
# tag says nothing about which glibc the binary needs. cibuildwheel builds
# inside an old-glibc container and tags the result `manylinux`, which is the
# only way a Linux wheel is publishable.
#
# macOS and Windows do not need it to be publishable; they are built the same
# way for one artifact set and one code path.
[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
build-frontend = "build"

# D1: one cp312-abi3 wheel per platform. Without this, cibuildwheel would
# build a separate wheel for every CPython it finds.
[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
